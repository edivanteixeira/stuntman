[package]
name = "stuntman-apis"
version = "0.11.13"
edition = "2021"

[dependencies]
stuntman-core.workspace = true
stuntman-telemetry.workspace = true
axum.workspace = true
tokio.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
regex.workspace = true
reqwest.workspace = true
base64.workspace = true
futures.workspace = true
bytes = "1"
rand.workspace = true
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
socket2 = "0.5"
time = "0.3"
rsa = { version = "0.9", features = ["sha2"] }
# REST PKI (Lacuna): PAdES signatures over real PDFs.
lopdf = { version = "0.47", default-features = false }
png = "0.17"
flate2 = "1"
sha1 = { version = "0.10", features = ["oid"] }
x509-parser = "0.18"
# SOAP: envelopes and WSDLs.
roxmltree = "0.20"
# WireMock response templates (A11).
handlebars = "6"
p12-keystore = "0.4.1"
fancy-regex = "0.14"
