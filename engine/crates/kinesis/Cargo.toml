axum = { workspace = true, features = ["http2"] }
tokio.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
futures.workspace = true
md5 = "0.7"
crc32fast = "1"
bytes = "1"
