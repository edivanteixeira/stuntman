[package]
name = "stuntman-messaging"
version = "0.11.5"
edition = "2021"

[dependencies]
stuntman-core.workspace = true
stuntman-streams.workspace = true
axum.workspace = true
tokio.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
regex.workspace = true
base64.workspace = true
rand.workspace = true
futures.workspace = true
amq-protocol = { version = "10", default-features = false }
cookie-factory = { version = "0.3", features = ["std"] }
nom = "8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
serde_amqp = "0.18"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
fe2o3-amqp-types = "0.18"
stuntman-apis.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
reqwest.workspace = true
