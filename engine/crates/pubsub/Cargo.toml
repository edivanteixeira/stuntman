[package]
name = "stuntman-pubsub"
version = "0.11.10"
edition = "2021"

[dependencies]
stuntman-core.workspace = true
stuntman-streams.workspace = true
stuntman-messaging.workspace = true
stuntman-kinesis.workspace = true
stuntman-storage.workspace = true
stuntman-identity.workspace = true
stuntman-ai.workspace = true
flate2 = "1"
crc32fast = "1"
ruzstd = "0.8"
bzip2-rs = "0.1"
lzma-rs = "0.3"
axum.workspace = true
tokio.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
base64.workspace = true
rand.workspace = true
futures.workspace = true
# The Pub/Sub messages and services are generated once from the googleapis protos into
# src/google.pubsub.v1.rs (no protoc at build time), like telemetry's opentelemetry-proto.
prost = "0.13"
prost-types = "0.13"
rquickjs = { version = "0.9", default-features = false }
tonic = { version = "0.13", default-features = false, features = ["transport", "codegen", "prost", "router", "server"] }

[dev-dependencies]
reqwest.workspace = true
