# Calendly API v2 for the Acme organization: users, memberships, event types, scheduled events and
# invitees, cancellations, no-shows, the Scheduling API (POST /invitees) and webhook subscriptions,
# plus OAuth (auth.calendly.com/oauth/authorize and /oauth/token). Webhooks are signed as Calendly
# does (Calendly-Webhook-Signature: t=…,v1=…) with the key below. Point the app at
# http://localhost:8028/calendly (both hosts). Any Bearer (personal access token or OAuth) works.
service:
  name: calendly
  title: Calendly
  origin: community
  description: Scheduling, invitees and signed webhooks (API v2)
  base_url: https://api.calendly.com
  real_host: api.calendly.com
  limits:
    latency: 120ms..350ms
  # Each delivery is signed with its subscription's signing_key; a subscription made without one
  # uses this key.
  webhooks:
    sign: stripe
    header: Calendly-Webhook-Signature
    secret: calendly-acme-signing-key
pages:
  - route: GET /oauth/authorize
    title: Calendly
    ask: "{{ query.client_id | default('The app') }} wants to access your Calendly account"
    fields:
      - person: {from: users, label: Sign in as}
    buttons: [Allow, Cancel]
    checks: [redirect_uri]
routes:
  - route: POST /oauth/token
    grant: authorization_code
  - route: GET /users/me
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - answer: me
  - route: GET /organization_memberships
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - when: "!has(query.user) && !has(query.organization)"
        answer: user_or_organization_required
      - answer: memberships
  - route: GET /event_types
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - when: "!has(query.user) && !has(query.organization)"
        answer: user_or_organization_required
      - answer: event_types
  - route: GET /scheduled_events
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - when: "!has(query.user) && !has(query.organization) && !has(query.group)"
        answer: user_or_organization_required
      - answer: scheduled_events
  - route: GET /scheduled_events/{uuid}/invitees
    let:
      event: "lookup('scheduled_events', 'uri', 'https://api.calendly.com/scheduled_events/' + path.uuid)"
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - when: "!has(event)"
        answer: not_found
      - answer: invitees
  # Cancels the event and sends invitee.canceled (for its first invitee) to the organization's
  # webhook subscription.
  - route: POST /scheduled_events/{uuid}/cancellation
    let:
      event: "lookup('scheduled_events', 'uri', 'https://api.calendly.com/scheduled_events/' + path.uuid)"
      hook: "state.webhook_subscriptions[data.users[0].current_organization]"
      hook_id: "(hook.body.organization + '|' + hook.body.url).sha256().upper()"
      hook_live: "has(hook) && !(has(state.deleted_webhooks[hook_id]) && state.deleted_webhooks[hook_id].at >= hook.at)"
      hook_url: "hook_live && 'invitee.canceled' in hook.body.events ? hook.body.url : ''"
      invitee: "data.invitees[path.uuid][0]"
    keep:
      state: canceled
      key: "has(event) && headers.authorization.startsWith('Bearer ') ? path.uuid : '__refused'"
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - when: "!has(event)"
        answer: not_found
      - when: "event.status == 'canceled' || has(state.canceled[path.uuid])"
        answer: already_canceled
      - answer: canceled
    send:
      - url: "{{ hook_url }}"
        event: invitee.canceled
        secret: "{{ has(hook) && has(hook.body.signing_key) ? hook.body.signing_key : 'calendly-acme-signing-key' }}"
        body: |
          {"created_at": "{{ now() }}", "created_by": "{{ data.users[0].uri }}", "event": "invitee.canceled",
           "payload": {"uri": "{{ invitee.uri }}", "email": "{{ invitee.email }}", "name": {{ json(invitee.name) }}, "first_name": {{ json(invitee.first_name) }}, "last_name": {{ json(invitee.last_name) }},
            "status": "canceled", "timezone": "{{ invitee.timezone }}", "event": "{{ event.uri }}", "created_at": "{{ invitee.created_at }}", "updated_at": "{{ now() }}",
            "questions_and_answers": [], "rescheduled": false, "old_invitee": null, "new_invitee": null, "no_show": null, "reconfirmation": null, "routing_form_submission": null, "text_reminder_number": null,
            "tracking": {"utm_campaign": null, "utm_source": null, "utm_medium": null, "utm_content": null, "utm_term": null, "salesforce_uuid": null},
            "cancel_url": "https://calendly.com/cancellations/{{ path.uuid }}", "reschedule_url": "https://calendly.com/reschedulings/{{ path.uuid }}",
            "cancellation": {"canceled_by": "{{ data.users[0].name }}", "reason": {{ json(default(body.reason, null)) }}, "canceler_type": "host", "created_at": "{{ now() }}"},
            "scheduled_event": {"uri": "{{ event.uri }}", "name": {{ json(event.name) }}, "status": "canceled", "start_time": "{{ event.start_time }}", "end_time": "{{ event.end_time }}", "event_type": "{{ event.event_type }}"}}}
  - route: POST /invitee_no_shows
    receive:
      body: [invitee]
      missing: invalid_argument
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - answer: no_show_created
  # The Scheduling API (2025): books an invitee directly and sends invitee.created.
  - route: POST /invitees
    receive:
      body: [event_type, start_time, invitee.email]
      missing: invalid_argument
    let:
      event_uuid: "uuid()"
      invitee_uuid: "uuid()"
      hook: "state.webhook_subscriptions[data.users[0].current_organization]"
      hook_id: "(hook.body.organization + '|' + hook.body.url).sha256().upper()"
      hook_live: "has(hook) && !(has(state.deleted_webhooks[hook_id]) && state.deleted_webhooks[hook_id].at >= hook.at)"
      hook_url: "hook_live && 'invitee.created' in hook.body.events ? hook.body.url : ''"
      event_type: "lookup('event_types', 'uri', body.event_type)"
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - when: "!has(event_type)"
        answer: event_type_not_found
      - answer: invitee_created
    send:
      - url: "{{ hook_url }}"
        event: invitee.created
        secret: "{{ has(hook) && has(hook.body.signing_key) ? hook.body.signing_key : 'calendly-acme-signing-key' }}"
        body: |
          {"created_at": "{{ now() }}", "created_by": "{{ data.users[0].uri }}", "event": "invitee.created",
           "payload": {"uri": "https://api.calendly.com/scheduled_events/{{ event_uuid }}/invitees/{{ invitee_uuid }}", "email": {{ json(body.invitee.email) }}, "name": {{ json(default(body.invitee.name, body.invitee.email)) }},
            "first_name": {{ json(default(body.invitee.first_name, null)) }}, "last_name": {{ json(default(body.invitee.last_name, null)) }}, "status": "active", "timezone": {{ json(default(body.invitee.timezone, 'UTC')) }},
            "event": "https://api.calendly.com/scheduled_events/{{ event_uuid }}", "created_at": "{{ now() }}", "updated_at": "{{ now() }}", "questions_and_answers": [], "rescheduled": false,
            "old_invitee": null, "new_invitee": null, "no_show": null, "reconfirmation": null, "cancellation": null, "routing_form_submission": null, "text_reminder_number": null,
            "tracking": {"utm_campaign": null, "utm_source": null, "utm_medium": null, "utm_content": null, "utm_term": null, "salesforce_uuid": null},
            "cancel_url": "https://calendly.com/cancellations/{{ invitee_uuid }}", "reschedule_url": "https://calendly.com/reschedulings/{{ invitee_uuid }}",
            "scheduled_event": {"uri": "https://api.calendly.com/scheduled_events/{{ event_uuid }}", "name": {{ json(event_type.name) }}, "status": "active", "start_time": {{ json(body.start_time) }}, "event_type": "{{ event_type.uri }}"}}}
  # One subscription per organization (the last one created wins).
  - route: POST /webhook_subscriptions
    receive:
      body: [url, events, organization, scope]
      missing: invalid_argument
    let:
      hook: "state.webhook_subscriptions[body.organization]"
      hook_id: "(body.organization + '|' + body.url).sha256().upper()"
      hook_live: "has(hook) && !(has(state.deleted_webhooks[hook_id]) && state.deleted_webhooks[hook_id].at >= hook.at)"
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - when: "hook_live && hook.body.url == body.url"
        answer: hook_exists
      - when: "body.scope == 'user' && !has(body.user)"
        answer: invalid_argument
      - answer: hook_created
    # A refused request (4xx) keeps nothing, so the subscription stays as it was.
    keep:
      state: webhook_subscriptions
      key: body.organization
  - route: GET /webhook_subscriptions
    let:
      hook: "state.webhook_subscriptions[query.organization]"
      hook_id: "(hook.body.organization + '|' + hook.body.url).sha256().upper()"
      hook_live: "has(hook) && !(has(state.deleted_webhooks[hook_id]) && state.deleted_webhooks[hook_id].at >= hook.at)"
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - when: "!has(query.organization) || !has(query.scope)"
        answer: invalid_argument
      - answer: hooks
  - route: DELETE /webhook_subscriptions/{uuid}
    keep:
      state: deleted_webhooks
      key: path.uuid
    decide:
      - when: "!headers.authorization.startsWith('Bearer ')"
        answer: unauthenticated
      - answer: hook_deleted
answers:
  - name: unauthenticated
    status: 401
    sentence: "Refused: the access token is invalid (401)"
    body: '{"title": "Unauthenticated", "message": "The access token is invalid"}'
  - name: rate_limited
    status: 429
    note: Calendly's rate limit; x-ratelimit-reset is the seconds until it resets. Exists only to be forced
    sentence: "Rate limited (429), resets in 30 s"
    headers: {x-ratelimit-limit: '500', x-ratelimit-remaining: '0', x-ratelimit-reset: '30'}
    body: '{"title": "Too Many Requests", "message": "You have exceeded the rate limit. Please try again later."}'
  - name: not_found
    status: 404
    sentence: "No scheduled event {{ path.uuid }}"
    body: '{"title": "Resource Not Found", "message": "The server could not find the requested resource."}'
  - name: invalid_argument
    status: 400
    sentence: "Refused: invalid parameters (400)"
    body: '{"title": "Invalid Argument", "message": "The supplied parameters are invalid."}'
  - name: user_or_organization_required
    status: 400
    sentence: "Refused: user or organization is required"
    body: '{"title": "Invalid Argument", "message": "The supplied parameters are invalid.", "details": [{"parameter": "user", "message": "One of user, organization, or group is required"}]}'
  - name: me
    sentence: "Current user: {{ data.users[0].name }}"
    body: |
      {"resource": {"uri": "{{ data.users[0].uri }}", "name": {{ json(data.users[0].name) }}, "slug": "{{ data.users[0].slug }}", "email": "{{ data.users[0].email }}",
       "scheduling_url": "https://calendly.com/{{ data.users[0].slug }}", "timezone": "{{ data.users[0].timezone }}", "time_notation": "12h", "avatar_url": null, "locale": "en",
       "created_at": "2024-02-01T12:00:00.000000Z", "updated_at": "2026-11-01T12:00:00.000000Z", "current_organization": "{{ data.users[0].current_organization }}", "resource_type": "User"}}
  - name: memberships
    sentence: "Listed {{ size(data.memberships) }} organization memberships"
    body: '{"collection": {{ json(data.memberships) }}, "pagination": {"count": {{ size(data.memberships) }}, "next_page": null, "previous_page": null, "next_page_token": null, "previous_page_token": null}}'
  - name: event_types
    sentence: "Listed {{ size(data.event_types) }} event types"
    body: '{"collection": {{ json(data.event_types) }}, "pagination": {"count": {{ size(data.event_types) }}, "next_page": null, "previous_page": null, "next_page_token": null, "previous_page_token": null}}'
  - name: scheduled_events
    sentence: "Listed {{ size(data.scheduled_events) }} scheduled events"
    body: '{"collection": {{ json(data.scheduled_events) }}, "pagination": {"count": {{ size(data.scheduled_events) }}, "next_page": null, "previous_page": null, "next_page_token": null, "previous_page_token": null}}'
  - name: invitees
    sentence: "Invitees of {{ event.name }}"
    body: '{"collection": {{ json(default(data.invitees[path.uuid], [])) }}, "pagination": {"count": {{ size(default(data.invitees[path.uuid], [])) }}, "next_page": null, "previous_page": null, "next_page_token": null, "previous_page_token": null}}'
  - name: canceled
    status: 201
    sentence: "Canceled {{ event.name }}{{ hook_url == '' ? '' : '; invitee.canceled sent' }}"
    body: '{"resource": {"canceled_by": {{ json(data.users[0].name) }}, "reason": {{ json(default(body.reason, null)) }}, "canceler_type": "host", "created_at": "{{ now() }}"}}'
  - name: already_canceled
    status: 403
    note: the event is canceled already (the message is close to Calendly's, not verified word for word)
    sentence: "Cancel refused: {{ event.name }} is already canceled"
    body: '{"title": "Permission Denied", "message": "Event is already canceled"}'
  - name: no_show_created
    status: 201
    sentence: "Marked {{ body.invitee }} as a no-show"
    body: '{"resource": {"uri": "https://api.calendly.com/invitee_no_shows/{{ uuid() }}", "invitee": {{ json(body.invitee) }}, "created_at": "{{ now() }}"}}'
  - name: event_type_not_found
    status: 404
    sentence: "Booking refused: no event type {{ body.event_type }}"
    body: '{"title": "Resource Not Found", "message": "The server could not find the requested resource."}'
  - name: invitee_created
    status: 201
    sentence: "Booked {{ body.invitee.email }} for {{ event_type.name }} at {{ body.start_time }}{{ hook_url == '' ? '' : '; invitee.created sent' }}"
    body: |
      {"resource": {"uri": "https://api.calendly.com/scheduled_events/{{ event_uuid }}/invitees/{{ invitee_uuid }}", "email": {{ json(body.invitee.email) }},
       "name": {{ json(default(body.invitee.name, body.invitee.email)) }}, "status": "active", "timezone": {{ json(default(body.invitee.timezone, 'UTC')) }},
       "event": "https://api.calendly.com/scheduled_events/{{ event_uuid }}", "created_at": "{{ now() }}", "updated_at": "{{ now() }}",
       "cancel_url": "https://calendly.com/cancellations/{{ invitee_uuid }}", "reschedule_url": "https://calendly.com/reschedulings/{{ invitee_uuid }}"}}
  - name: hook_created
    status: 201
    sentence: "Webhook subscription to {{ body.url }} for {{ json(body.events) }}"
    body: |
      {"resource": {"uri": "https://api.calendly.com/webhook_subscriptions/{{ hook_id }}", "callback_url": {{ json(body.url) }}, "created_at": "{{ now() }}", "updated_at": "{{ now() }}",
       "retry_started_at": null, "state": "active", "events": {{ json(body.events) }}, "scope": {{ json(body.scope) }}, "organization": {{ json(body.organization) }},
       "user": {{ json(default(body.user, null)) }}, "group": null, "creator": "{{ data.users[0].uri }}"}}
  - name: hook_exists
    status: 409
    sentence: "Webhook refused: {{ body.url }} is already subscribed"
    body: '{"title": "Already Exists", "message": "Hook with this url already exists"}'
  - name: hooks
    sentence: "Listed {{ hook_live ? 1 : 0 }} webhook subscription(s)"
    body: |
      {"collection": [{{ hook_live ? json({"uri": "https://api.calendly.com/webhook_subscriptions/" + hook_id, "callback_url": hook.body.url, "created_at": now(), "updated_at": now(), "retry_started_at": null, "state": "active", "events": hook.body.events, "scope": hook.body.scope, "organization": hook.body.organization, "user": default(hook.body.user, null), "group": null, "creator": data.users[0].uri}) : '' }}],
       "pagination": {"count": {{ hook_live ? 1 : 0 }}, "next_page": null, "previous_page": null, "next_page_token": null, "previous_page_token": null}}
  - name: hook_deleted
    status: 204
    sentence: "Deleted webhook subscription {{ path.uuid }}"
