    - {name: Emma Carter, email: emma.carter@acme.example.com, cpf: '108234567890123456781', permission_id: '04563228391872643501', photo: 'https://lh3.googleusercontent.com/a/default-user=s64', refresh_token: '1//0gAcmeEmmaCarterRefreshTokenSynthetic'}
