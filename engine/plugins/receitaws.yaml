# ReceitaWS: public CNPJ lookup (GET /v1/cnpj/{cnpj}), the free tier: 3 calls a minute, then 429.
# The check digits are computed (wrong ones answer "CNPJ inválido"); the companies table answers
# for its CNPJs (formatted or digits only); any other valid CNPJ is rejected by the Receita.
# Synthetic companies only. Lets run alphabetically: a_n, b_s1, c_dv1, d_s2, e_dv2.
service:
  name: receitaws
  title: ReceitaWS
  origin: community
  region: BR
  description: CNPJ lookup - company registration data from the Receita Federal
  base_url: https://receitaws.com.br/v1
  real_host: receitaws.com.br
  limits:
    latency: 200ms..900ms
    rate: 3/min
routes:
  - route: GET /v1/cnpj/{cnpj}
    let:
      a_n: double(digits(path.cnpj))
      b_s1: (int(a_n / 10000000000000) % 10) * 5 + (int(a_n / 1000000000000) % 10) * 4 + (int(a_n / 100000000000) % 10) * 3 + (int(a_n / 10000000000) % 10) * 2 + (int(a_n / 1000000000) % 10) * 9 + (int(a_n / 100000000) % 10) * 8 + (int(a_n / 10000000) % 10) * 7 + (int(a_n / 1000000) % 10) * 6 + (int(a_n / 100000) % 10) * 5 + (int(a_n / 10000) % 10) * 4 + (int(a_n / 1000) % 10) * 3 + (int(a_n / 100) % 10) * 2
      c_dv1: "b_s1 % 11 < 2 ? 0 : 11 - b_s1 % 11"
      d_s2: (int(a_n / 10000000000000) % 10) * 6 + (int(a_n / 1000000000000) % 10) * 5 + (int(a_n / 100000000000) % 10) * 4 + (int(a_n / 10000000000) % 10) * 3 + (int(a_n / 1000000000) % 10) * 2 + (int(a_n / 100000000) % 10) * 9 + (int(a_n / 10000000) % 10) * 8 + (int(a_n / 1000000) % 10) * 7 + (int(a_n / 100000) % 10) * 6 + (int(a_n / 10000) % 10) * 5 + (int(a_n / 1000) % 10) * 4 + (int(a_n / 100) % 10) * 3 + c_dv1 * 2
      e_dv2: "d_s2 % 11 < 2 ? 0 : 11 - d_s2 % 11"
      company: lookup('companies', 'cnpj', path.cnpj)
    decide:
      - when: size(digits(path.cnpj)) != 14 || a_n == 0 || a_n % 100 != c_dv1 * 10 + e_dv2
        answer: invalid_cnpj
      - when: has(company)
        answer: found
      - answer: rejected
answers:
  - name: found
    note: a company of the table (ATIVA, BAIXADA or INAPTA)
    sentence: "Looked up {{ company.cnpj }}: {{ company.nome }} ({{ company.situacao }})"
    body: '{{ json(company) }}'
  - name: invalid_cnpj
    note: wrong length or check digits
    sentence: "CNPJ {{ path.cnpj }} is invalid"
    body: '{"status": "ERROR", "message": "CNPJ inválido"}'
  - name: rejected
    note: a valid CNPJ the Receita does not know
    sentence: "CNPJ {{ path.cnpj }} rejected by the Receita"
    body: '{"status": "ERROR", "message": "CNPJ rejeitado pela Receita Federal"}'
  - name: '429'
    status: 429
    note: over the free tier's 3 calls a minute
    sentence: "Too many requests (free tier: 3 a minute)"
    headers: {Content-Type: text/plain; charset=utf-8}
    body: Too many requests, please try again later.
