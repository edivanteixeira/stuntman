[package]
name = "stuntman-web"
version = "0.10.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["EventSource", "Storage", "MessageEvent", "Clipboard", "Navigator", "Window", "Document", "HtmlIFrameElement", "Selection", "HtmlTextAreaElement", "KeyboardEvent", "Location", "MouseEvent", "EventTarget", "Event", "Element", "DomRect", "File", "FileList", "HtmlInputElement", "DataTransfer", "DragEvent", "Blob"] }
console_error_panic_hook = "0.1"
